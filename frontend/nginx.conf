server {
    listen 80;
    server_name _;
    client_max_body_size 1100m;
    proxy_read_timeout 300s;

    # 文本类资源统一压缩：首屏 JS/CSS 约 276KB → 80KB 左右
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml application/manifest+json image/svg+xml
        font/ttf font/otf;

    root /usr/share/nginx/html;
    index index.html;

    # 带内容哈希的构建产物：一年内不可变，命中本地缓存不再回源
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 入口 HTML 必须每次校验，避免发版后仍加载旧资源清单
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 前端路由（history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Django admin 后台（生产 DEBUG=0 时由后端托管页面与静态资源）
    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Django 静态资源（admin 的 CSS/JS、DRF  browsable API 资源；
    # 生产由 WhiteNoise 从 backend/staticfiles/ 直接吐，不走 Django 视图）
    location /static/ {
        proxy_pass http://backend:8000/static/;
        proxy_set_header Host $host;
    }

    # 媒体文件（上传/缩略图/下载）
    location /media/ {
        proxy_pass http://backend:8000/media/;
        proxy_set_header Host $host;
    }

    # 公开共享链接
    location /share/ {
        proxy_pass http://backend:8000/share/;
        proxy_set_header Host $host;
    }

    # WebSocket 实时通道
    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
