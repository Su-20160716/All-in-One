# 自动构建后端 Docker 镜像并推送到 GHCR（GitHub 容器仓库）
# 推送 main 分支或手动触发时构建；镜像供 ClawCloud Run 等容器平台拉取。
name: Build backend image

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - ".github/workflows/build-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 登录 GHCR（GITHUB_TOKEN 由 GitHub 自动提供，无需手动配密钥）
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 自动转小写的镜像名：ghcr.io/<所有者>/coop-backend
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/coop-backend
          tags: |
            latest

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
