# Render 蓝图：一键创建免费后端服务（Render 官方配置格式）
# 用法：Render Dashboard → New → Blueprint → 选中本仓库即可自动识别本文件。
# 前端不在本蓝图内：在 Cloudflare Pages 上单独配置（见 docs/07-免费部署指南.md）。
services:
  - type: web
    name: coop-platform-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    healthCheckPath: /api/core/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      # 云数据库连接串（Supabase/Neon）：不填则使用 SQLite。
      # ⚠️ SQLite 模式下 Render 免费档休眠唤醒即清盘（数据随休眠丢失），
      # 真要用了在 Render Dashboard 的 Environment 里手动添加 DATABASE_URL 即可切换。
      # 填法示例（Supabase Session pooler）：
      # postgresql://postgres.<ref>:<密码>@aws-0-<region>.pooler.supabase.com:5432/postgres
      # - key: DATABASE_URL
      #   sync: false
      # 前端站点地址，部署完 Cloudflare Pages 后回填，如：
      # https://coop-platform.pages.dev,https://你的自定义域名
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      # 可选：AI 助手大模型密钥（不填则自动降级为本地实现，功能仍可用）
      - key: LLM_API_KEY
        sync: false
