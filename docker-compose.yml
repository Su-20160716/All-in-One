# 全能协作平台 —— 一键容器编排
#
# 本地开发：docker compose up -d --build  然后打开 http://localhost
# 生产部署（ClawCloud Run）：平台按环境变量注入配置，DATA_DIR 挂持久卷；
#   必填 DJANGO_DEBUG=0；可选 DATABASE_URL（不填用 SQLite，放 DATA_DIR）；
#   变量清单见 .env.example（S3-B1/D5）。
#
# 所有环境变量走 ${VAR:-默认值} 形式：本地零配置起，生产按需覆盖。
services:
  backend:
    build: ./backend
    container_name: aio-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # 持久化数据库与上传文件（容器重建不丢失）。
      # 生产：DATA_DIR 指向平台持久卷挂载点（ClawCloud Run 卷）；
      # 本地：默认落到 ./backend 目录，与既有的 dev 库/媒体共存。
      - ${DATA_DIR:-./backend}:/data
    environment:
      DJANGO_DEBUG: "${DJANGO_DEBUG:-1}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-*}"
      DJANGO_DATA_DIR: /data
      # 生产连 Postgres 时注入（不填则 SQLite，库文件落在 /data/db.sqlite3）
      DATABASE_URL: "${DATABASE_URL:-}"
      # LLM（不配则全部 AI 能力本地降级，见 core/adapters.py 探测）
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      # 跨域信任（生产填前端域名，多个用逗号分隔）
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-}"
      # 与 settings.py 读取的变量名保持一致；生产必须显式提供，否则后端拒绝启动
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-}"
    # #130 容器探活：与 Dockerfile HEALTHCHECK 一致（免登录健康检查，带 https 头
    # 避免生产分支 SECURE_SSL_REDIRECT 把探测 301 掉）
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request as u,sys; r=u.Request('http://127.0.0.1:8000/api/core/health/', headers={'X-Forwarded-Proto':'https'}); sys.exit(0 if u.urlopen(r, timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # #130 日志轮转：容器日志不设上限会写满宿主磁盘
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      args:
        # 前端构建期变量：指向后端地址（同域部署时留空走 nginx 代理的相对路径）
        VITE_API_BASE: "${VITE_API_BASE:-}"
    container_name: aio-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    # #130：等后端健康（而非仅启动）再拉起前端，避免首屏 502
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
